name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies and build
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          npm run build

      - name: Deploy to marmiya.makalla.org
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || '22' }}
          SOURCE: './'
          TARGET: ${{ secrets.DEPLOY_PATH }}
          EXCLUDE: '/.git/, /.github/, /node_modules/, /tests/, /.env, /storage/logs/, /storage/framework/cache/data/, /storage/framework/sessions/, /storage/framework/views/, /storage/app/private/database-backups/'
          SCRIPT_AFTER: |
            cd "$DEPLOY_PATH"
            bash deploy/post-deploy.sh "$DEPLOY_PATH"
